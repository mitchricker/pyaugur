[project]
name = "pyaugur"
version = "0.1.0"
description = "A package for tarot cards in Python."
authors = [
    {name = "mitch",email = "mitch@automating.systems"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "ruff (>=0.15.4,<0.16.0)"
]
